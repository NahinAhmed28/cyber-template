{{> head pageTitle='Login' pageCss='' }}

	<!-- BEGIN #app -->
	<div id="app" class="app app-full-height app-without-header">
		<!-- BEGIN login -->
		<div class="login">
			<!-- BEGIN login-content -->
			<div class="login-content">
				<form action="index.html" method="GET" name="login_form">
					<div class="display-4 text-center text-body text-opacity-75"><iconify-icon icon="solar:shield-keyhole-line-duotone"></iconify-icon></div>
					<h1 class="text-center">SIGN IN</h1>
					<div class="text-body text-opacity-50 text-center mb-4 fs-6 text-uppercase">
						For your protection, please verify your identity.
					</div>
					<div class="mb-3">
						<label class="form-label text-uppercase">Email Address <span class="text-danger">*</span></label>
						<input type="text" class="form-control form-control-lg fs-6" value="" placeholder="" />
					</div>
					<div class="mb-3">
						<div class="d-flex">
							<label class="form-label text-uppercase">Password <span class="text-danger">*</span></label>
							<a href="#" class="ms-auto link-secondary text-uppercase">Forgot password?</a>
						</div>
						<input type="password" class="form-control form-control-lg fs-6" value="" placeholder="" />
					</div>
					<div class="mb-3">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="customCheck1" />
							<label class="form-check-label text-uppercase" for="customCheck1">Remember me</label>
						</div>
					</div>
					<button type="submit" class="btn btn-outline-light btn-lg d-block w-100 mb-3 text-uppercase">Sign In</button>
					<div class="text-center text-body text-opacity-50 text-uppercase">
						Don't have an account yet? <a href="page_register.html" class="link-secondary">Sign up</a>.
					</div>
				</form>
			</div>
			<!-- END login-content -->
		</div>
		<!-- END login -->
		
		{{> app-theme-panel }}
		
		{{> app-scroll-top-btn }}
	</div>
	<!-- END #app -->
	
{{> script pageJs='' }}
